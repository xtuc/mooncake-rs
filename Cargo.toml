[package]
name = "mooncake-rs"
version = "0.1.1"
edition = "2021"
authors = ["Sven Sauleau <sven@cloudflare.com>"]
description = "FFI bindings for Mooncake Transfer Engine"
license = "Apache-2.0"
repository = "https://github.com/xtuc/mooncake-rs"
keywords = ["mooncake", "transfer-engine", "rdma", "gpu", "ffi"]
categories = ["external-ffi-bindings", "hardware-support"]
rust-version = "1.70"
exclude = [
    "install",
    "Makefile",
    ".git",
    ".gitmodules",
    "deps/mooncake/build",
    "deps/mooncake/**/build",
    "deps/mooncake/**/CMakeCache.txt",
    "deps/mooncake/**/CMakeFiles",
    "deps/mooncake/**/Makefile",
    "deps/mooncake/**/cmake_install.cmake",
    "deps/mooncake/**/CTestTestfile.cmake",
    "deps/mooncake/**/compile_commands.json",
    "deps/mooncake/**/.ninja_deps",
    "deps/mooncake/**/.ninja_log",
    "deps/mooncake/extern/**/build",
    "target",
    "*.a",
    "*.so",
]

[dependencies]
libc = "0.2"
once_cell = "1.19"
thiserror = "1.0"
tracing = "0.1"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[lib]
name = "mooncake"
crate-type = ["rlib"]
