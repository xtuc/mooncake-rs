[package]
name = "mooncake-rs"
version = "0.1.3"
edition = "2021"
authors = ["Sven Sauleau <sven@cloudflare.com>"]
description = "FFI bindings for Mooncake Transfer Engine"
license = "Apache-2.0"
repository = "https://github.com/xtuc/mooncake-rs"
keywords = ["mooncake", "transfer-engine", "rdma", "gpu", "ffi"]
categories = ["external-ffi-bindings", "hardware-support"]
rust-version = "1.70"
exclude = [
    "deps",
    "install",
    "Makefile",
    ".git",
    ".gitmodules",
    "target",
]

[dependencies]
libc = "0.2"
once_cell = "1.19"
thiserror = "1.0"
tracing = "0.1"

[features]
default = []
# Build cdylib (shared library) - requires C++ libs to be available
cdylib = []

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[lib]
name = "mooncake"
crate-type = ["rlib"]
